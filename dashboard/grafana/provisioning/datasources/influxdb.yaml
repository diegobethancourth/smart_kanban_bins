# InfluxDB data source, filled from .env when Grafana starts (T2.8)
apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb-smart-kanban
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      token: ${INFLUX_TOKEN}

# Local MQTT broker for the offline fallback (docker compose --profile local).
# Anonymous access is acceptable here because it only listens on the demo laptop.
# The cloud broker (EMQX) requires user and password and TLS.
listener 1883

# MQTT over WebSocket, for the 3D twin in Cloud mode: ws://localhost:9001
listener 9001
protocol websockets
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
